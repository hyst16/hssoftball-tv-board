<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HS Softball TV — Teams Builder</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; color: #1f2937; }
    .grid { display: grid; grid-template-columns: 1fr 1fr 360px; gap: 12px; align-items: start; }
    .panel { border: 1px solid #d1d5db; border-radius: 6px; padding: 12px; }
    h1, h2 { margin-top: 0; } h2 { font-size: 1.2rem; }
    input, select, button { box-sizing: border-box; padding: 7px; font: inherit; }
    input, select { width: 100%; } button { cursor: pointer; }
    .controls, .team, .office-header, .selected { display: flex; gap: 8px; align-items: center; }
    .controls { flex-wrap: wrap; margin-top: 8px; } .team, .selected { padding: 6px 0; border-bottom: 1px solid #f3f4f6; }
    .team-name, .selected-name { flex: 1; } .list { max-height: 520px; overflow: auto; }
    .badge { border-radius: 999px; font-size: .75rem; padding: 3px 8px; }
    .ok { background: #dcfce7; color: #166534; } .warn { background: #fef3c7; color: #92400e; } .missing { background: #fee2e2; color: #991b1b; }
    .office { border: 1px solid #e5e7eb; border-radius: 5px; padding: 8px; margin-bottom: 8px; }
    .office-header { justify-content: space-between; font-weight: 600; } pre { overflow: auto; background: #f3f4f6; padding: 8px; }
    .hint { color: #4b5563; font-size: .875rem; } a { color: #2563eb; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Debug / Teams Builder</h1>
  <p class="hint">Choose a team, add it to an office, then copy the generated JSON to save it in GitHub.</p>
  <p id="meta" class="hint">Loading data…</p>
  <main class="grid">
    <section class="panel">
      <h2>Teams</h2>
      <select id="class-filter"><option value="">All classes</option></select>
      <p><input id="filter" type="search" placeholder="Filter team names"></p>
      <div id="team-list" class="list"></div>
    </section>
    <section class="panel">
      <h2>Office builder</h2>
      <label for="office-select">Office to edit</label>
      <select id="office-select"><option value="">Create new office</option></select>
      <p><label for="office-key">Office key</label><input id="office-key" placeholder="mead-office"></p>
      <div id="selected-list"></div>
      <div class="controls">
        <button id="apply">Apply key</button><button id="copy">Copy JSON</button>
        <button id="download">Download</button><button id="delete">Delete office</button>
        <a id="github-edit" target="_blank" rel="noopener noreferrer">Edit on GitHub</a>
      </div>
      <h2>Preview</h2><pre id="preview">{}</pre>
    </section>
    <section class="panel">
      <h2>Offices & validation</h2><div id="offices"></div>
    </section>
  </main>
  <script>
    const REPO = "https://github.com/hyst16/hssoftball-tv-board/edit/main/teams.json";
    const normalize = value => (value || "").toLowerCase().replace(/[^a-z0-9]+/g, "");
    const slug = value => (value || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    let teams = [], config = {};
    const $ = id => document.getElementById(id);

    function selectedKey() { return $("office-select").value || $("office-key").value.trim(); }
    function updatePreview() { $("preview").textContent = JSON.stringify(config, null, 2); }
    function populateOffices(selectKey = selectedKey()) {
      const select = $("office-select");
      select.replaceChildren(new Option("Create new office", ""));
      Object.keys(config).sort().forEach(key => select.add(new Option(key, key)));
      select.value = config[selectKey] ? selectKey : "";
    }
    function renderSelected() {
      const key = selectedKey(), container = $("selected-list");
      container.replaceChildren();
      (config[key] || []).forEach(name => {
        const row = document.createElement("div"); row.className = "selected";
        const label = document.createElement("span"); label.className = "selected-name"; label.textContent = name;
        const remove = document.createElement("button"); remove.textContent = "Remove";
        remove.onclick = () => { config[key] = config[key].filter(team => team !== name); render(); };
        row.append(label, remove); container.append(row);
      });
      if (!container.children.length) container.textContent = "No teams selected.";
    }
    function renderTeamList() {
      const query = $("filter").value.toLowerCase().trim(), className = $("class-filter").value;
      const container = $("team-list"); container.replaceChildren();
      teams.filter(team => (!className || team.className === className) && (!query || team.name.toLowerCase().includes(query)))
        .sort((a, b) => a.name.localeCompare(b.name)).forEach(team => {
          const row = document.createElement("div"); row.className = "team";
          const label = document.createElement("span"); label.className = "team-name"; label.textContent = `${team.name} (${team.className})`;
          const add = document.createElement("button"); add.textContent = "Add";
          add.onclick = () => {
            const key = selectedKey() || `${slug(team.name)}-office`;
            if (!config[key]) config[key] = [];
            if (!config[key].some(name => normalize(name) === normalize(team.name))) config[key].push(team.name);
            $("office-key").value = key; render();
          };
          const used = Object.values(config).some(names => names.some(name => normalize(name) === normalize(team.name)));
          const badge = document.createElement("span"); badge.className = `badge ${used ? "ok" : "warn"}`; badge.textContent = used ? "Assigned" : "Unassigned";
          row.append(label, add, badge); container.append(row);
        });
    }
    function renderOffices() {
      const container = $("offices"); container.replaceChildren();
      Object.keys(config).sort().forEach(key => {
        const card = document.createElement("div"); card.className = "office";
        const header = document.createElement("div"); header.className = "office-header";
        const title = document.createElement("span"); title.textContent = key;
        const edit = document.createElement("button"); edit.textContent = "Edit"; edit.onclick = () => { $("office-select").value = key; $("office-key").value = key; render(); };
        header.append(title, edit); card.append(header);
        config[key].forEach(name => {
          const row = document.createElement("div"); row.className = "team";
          const label = document.createElement("span"); label.className = "team-name"; label.textContent = name;
          const found = teams.some(team => normalize(team.name) === normalize(name));
          const badge = document.createElement("span"); badge.className = `badge ${found ? "ok" : "missing"}`; badge.textContent = found ? "Found" : "Missing";
          row.append(label, badge); card.append(row);
        });
        container.append(card);
      });
    }
    function render() { populateOffices(); renderSelected(); renderTeamList(); renderOffices(); updatePreview(); }
    async function load() {
      try {
        const [data, saved] = await Promise.all([
          fetch("data/softball.json").then(response => response.ok ? response.json() : Promise.reject(new Error("softball.json unavailable"))),
          fetch("teams.json").then(response => response.ok ? response.json() : Promise.reject(new Error("teams.json unavailable")))
        ]);
        teams = Object.values(data.by_team || {}).map(rows => rows[0]).filter(Boolean).map(row => ({ name: row._team || row._team_display, className: row._class || row.Class || "Unknown" }));
        config = saved;
        [...new Set(teams.map(team => team.className))].sort().forEach(className => $("class-filter").add(new Option(className, className)));
        $("meta").textContent = `Scrape updated: ${new Date((data.updated || 0) * 1000).toLocaleString()}`;
        render();
      } catch (error) { $("meta").textContent = `Error loading data: ${error.message}`; }
    }
    $("github-edit").href = REPO;
    $("filter").oninput = renderTeamList; $("class-filter").onchange = renderTeamList;
    $("office-select").onchange = () => { $("office-key").value = $("office-select").value; renderSelected(); updatePreview(); };
    $("apply").onclick = () => { const oldKey = $("office-select").value, key = $("office-key").value.trim(); if (!key) return alert("Enter an office key."); if (oldKey && oldKey !== key) { config[key] = config[oldKey]; delete config[oldKey]; } else if (!config[key]) config[key] = []; $("office-key").value = key; render(); };
    $("delete").onclick = () => { const key = $("office-select").value; if (!key) return alert("Select an office to delete."); if (confirm(`Delete ${key}?`)) { delete config[key]; $("office-key").value = ""; render(); } };
    $("copy").onclick = async () => { await navigator.clipboard.writeText(JSON.stringify(config, null, 2)); alert("JSON copied."); };
    $("download").onclick = () => { const url = URL.createObjectURL(new Blob([JSON.stringify(config, null, 2)], { type: "application/json" })); const link = document.createElement("a"); link.href = url; link.download = "teams.json"; link.click(); URL.revokeObjectURL(url); };
    load();
  </script>
</body>
</html>
